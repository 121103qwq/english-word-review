[package]
name = "english-word-review"
version = "8.3.1"
description = "Offline English vocabulary review"
authors = ["English Rebuilt"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "english_word_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
